<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ride Tracker Pro | Chanthiran</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <style>
        :root {
            --neon-green: #32D74B;
            --accent-blue: #0A84FF;
            --danger-red: #FF453A;
            --warning-yellow: #FFCC00;
            --card-bg: #1c1c1e;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: #000; color: #fff; margin: 0;
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }

        /* HEADER */
        .header { padding: 25px 20px 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        .header-info { display: flex; flex-direction: column; }
        #fullDate { font-size: 1.1rem; font-weight: 900; }
        #liveClock { font-size: 1rem; margin-top: 5px; font-weight: 800; opacity: 0.8; }
        .title-container { flex: 1; display: flex; padding-left: 20px; align-items: center; gap: 12px; }
        .app-title { color: var(--neon-green); font-size: 0.9rem; font-weight: 800; text-transform: uppercase; margin: 0; }
        .app-subtitle { color: #fff; font-size: 0.55rem; letter-spacing: 3px; opacity: 0.7; }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }
        .riding-pulse { animation: pulse 1.5s infinite ease-in-out; }

        .main-display { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 0 25px; position: relative; }
        #map { position: absolute; top: 10px; bottom: 10px; left: 15px; right: 15px; border-radius: 20px; border: 1px solid #333; z-index: 5; display: none; }
        
        .main-stat { 
            font-size: clamp(6.5rem, 25vw, 8.5rem); 
            font-weight: 900; margin: 0; 
            background: linear-gradient(180deg, #444 30%, var(--neon-green)); 
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
            line-height: 0.8; z-index: 10; pointer-events: none;
            filter: drop-shadow(0 0 15px rgba(50, 215, 75, 0.6));
        }

        .label-row { display: flex; align-items: center; justify-content: center; gap: 15px; margin-top: 10px; width: 100%; z-index: 10; }
        .label { font-size: 1rem; color: #666; letter-spacing: 4px; font-weight: 800; margin: 0; }
        #gpsIcon { font-size: 24px; transition: all 0.3s ease; color: #333; }
        .sig-good { color: var(--accent-blue) !important; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; width: 100%; margin-top: 30px; text-align: center; z-index: 10; }
        .stat-box h2 { margin: 0; font-size: 2rem; }
        .stat-box p { margin: 5px 0; font-size: 0.7rem; color: #888; font-weight: bold; }

        /* CONTROLS */
        .controls-bar { background: #121212; padding: 20px 20px 140px 20px; display: flex; flex-direction: column; align-items: center; border-top: 1px solid #1c1c1e; border-radius: 45px 45px 0 0; z-index: 100; }
        .goal-container { width: 90%; margin-bottom: 5px; }
        .progress-bg { width: 100%; height: 10px; background: #2c2c2e; border-radius: 5px; overflow: hidden; margin-top: 8px; }
        .progress-fill { height: 100%; background: var(--neon-green); width: 0%; transition: width 0.5s ease; }

        .button-row { display: flex; width: 100%; justify-content: space-around; align-items: center; margin-top: 10px; }
        .new-ride-circle { width: 55px; height: 55px; background: linear-gradient(145deg, #1b5e20, #32D74B); border: 2px solid #555; border-radius: 50%; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; text-align: center; }
        .new-ride-circle span { color: white; font-weight: 900; line-height: 1; pointer-events: none; }
        
        .btn { display: flex; align-items: center; justify-content: center; border-radius: 50%; border: none; cursor: pointer; }
        .btn-main { width: 85px; height: 85px; }
        .btn-side { width: 50px; height: 50px; background: #2c2c2e; color: #fff; }
        .start { background: var(--neon-green); color: #000; }
        .stop { background: var(--danger-red); color: #fff; }
        .hidden { display: none !important; }

        /* MODALS */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 2000; display: none; justify-content: center; align-items: flex-end; }
        .quick-note { background: var(--card-bg); width: 100%; border-radius: 30px 30px 0 0; max-height: 85vh; overflow-y: auto; }
        .sticky-history-header { position: sticky; top: 0; background: rgba(28, 28, 30, 0.95); backdrop-filter: blur(10px); z-index: 10; padding: 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        .chart-wrapper { margin: 15px 25px; padding: 20px 10px 35px 10px; background: #121212; border-radius: 15px; border: 1px solid #333; overflow-x: auto; white-space: nowrap; }
        .chart-container { display: inline-flex; align-items: flex-end; gap: 15px; min-width: 100%; height: 120px; }
        .chart-bar { flex: 0 0 45px; background: var(--neon-green); border-radius: 6px 6px 0 0; position: relative; display: flex; align-items: flex-end; justify-content: center; }
        .chart-bar span.bar-val { writing-mode: vertical-rl; transform: rotate(180deg); color: var(--accent-blue); font-size: 0.6rem; font-weight: 900; margin-bottom: 8px; }
        .chart-bar span.bar-date { position: absolute; bottom: -25px; color: #888; font-size: 0.6rem; font-weight: 800; }
        .history-list-container { padding: 10px 25px 120px 25px; }
        .history-item { background: #2c2c2e; margin-bottom: 12px; padding: 15px; border-radius: 15px; border-left: 4px solid var(--accent-blue); display: flex; justify-content: space-between; align-items: center; }

        .standard-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2100; display: none; justify-content: center; align-items: center; }
        .modal-card { background: var(--card-bg); width: 85%; padding: 30px; border-radius: 25px; text-align: center; }
        
        .leaflet-tile-container { filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%); }
        .satellite-view .leaflet-tile-container { filter: none !important; }

        /* Pocket Lock Styles */
        #pocketLock {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #000; z-index: 9999; flex-direction: column; justify-content: center; align-items: center;
        }
        #unlockBtn {
            background: transparent; border: 2px solid #222; color: #222; width: 120px; height: 120px; 
            border-radius: 50%; transition: all 0.2s ease; display: flex; align-items: center; justify-content: center;
        }

        /* Short Blue Volume Bar */
        .vol-container { width: 60% !important; margin: 5px auto 15px auto; }
        #volSlider { -webkit-appearance: none; width: 100%; height: 6px; background: #333; border-radius: 5px; outline: none; }
        #volSlider::-webkit-slider-runnable-track { width: 100%; height: 6px; cursor: pointer; background: #0A84FF; border-radius: 5px; }
        #volSlider::-webkit-slider-thumb { 
            height: 18px; width: 18px; border-radius: 50%; background: #0A84FF; 
            cursor: pointer; -webkit-appearance: none; margin-top: -6px; box-shadow: 0 0 5px rgba(0,0,0,0.5); 
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-info">
            <span id="fullDate">--/--/----</span>
            <span id="liveClock">00:00:00</span>
        </div>
        <div class="title-container">
            <span id="headerRideIcon" class="material-icons-round" style="color: var(--neon-green); font-size: 2.2rem;">directions_bike</span>
            <div>
                <div class="app-title">Chanthiran</div>
                <div class="app-subtitle">RIDE TRACKER</div>
            </div>
        </div>
        <button id="mapLoopBtn" class="btn btn-side" style="width:40px; height:40px;"><span class="material-icons-round">map</span></button>
    </div>
    
    <div class="main-display">
        <div id="map"></div>
        <p class="main-stat" id="distance">0.00</p>
        <div class="label-row">
            <p class="label">KILOMETERS</p>
            <span id="gpsIcon" class="material-icons-round">gps_fixed</span>
        </div>
        <div class="stats-grid">
            <div class="stat-box"> <h2 id="timer">00:00</h2> <p>TIME</p> </div>
            <div class="stat-box"> <h2 id="pace">0'00"</h2> <p>PACE</p> </div>
        </div>
    </div>

    <div class="controls-bar">
        <div class="goal-container">
            <div style="display:flex; justify-content: space-between; font-size: 0.8rem; font-weight: 800;">
                <div><span class="material-icons-round" id="editGoal" style="color:var(--warning-yellow); cursor:pointer; font-size: 18px; vertical-align: middle;">edit</span> DONE: <b id="doneKm">0.00</b></div>
                <span>BAL: <b id="balKm">0.00</b></span>
            </div>
            <div class="progress-bg"><div class="progress-fill" id="progressBar"></div></div>
        </div>

        <div style="width: 90%; display: flex; justify-content: space-between; margin: 10px 0; font-size: 0.75rem; font-weight: 700;">
            <span id="balDateDisplay">DUE: NOT SET</span>
            <span id="daysLeftDisplay"></span>
        </div>

        <div style="width: 90%; display: flex; align-items: center; gap: 10px; margin-bottom: 5px;">
            <span class="material-icons-round" id="editLoc" style="color: var(--accent-blue); cursor:pointer;">place</span>
            <span id="locDisplay" style="font-size: 0.8rem; color: var(--accent-blue); font-weight: 800; text-transform: uppercase;">NOT SET</span>
        </div>

        <div class="vol-container" style="display: flex; align-items: center; gap: 10px;">
            <span class="material-icons-round" style="font-size: 18px; color: #0A84FF;">volume_up</span>
            <input type="range" id="volSlider" min="0" max="1" step="0.1" value="1">
        </div>

        <div id="accDisplay" style="font-size: 0.6rem; font-weight: 900; margin-bottom: 15px; opacity: 0.8;">GPS SEARCHING...</div>
        
        <div class="button-row">
            <button class="btn btn-side" id="openHistory" style="color:var(--accent-blue);"><span class="material-icons-round">analytics</span></button>
            <button class="btn btn-side" id="lockBtn" style="color:var(--warning-yellow);"><span class="material-icons-round">lock</span></button>
            <div class="new-ride-circle" id="newRideBtn">
                <span style="font-size: 0.6rem; margin-bottom: 2px;">NEW</span>
                <span style="font-size: 0.75rem;">RIDE</span>
            </div>
            <button id="startBtn" class="btn btn-main start"><span class="material-icons-round" id="startIcon" style="font-size: 3.5rem;">play_arrow</span></button>
            <button id="stopBtn" class="btn btn-main stop hidden"><span class="material-icons-round" style="font-size: 3.5rem;">stop</span></button>
        </div>
    </div>

    <div id="pocketLock">
        <p style="color:#222; font-weight:900; letter-spacing:4px; margin-bottom: 20px;">POCKET MODE ACTIVE</p>
        <button id="unlockBtn">
            <span class="material-icons-round" style="font-size:3rem;">lock_open</span>
        </button>
        <p style="color:#333; font-size: 0.7rem; margin-top: 20px; font-weight: 800;">HOLD TO UNLOCK</p>
    </div>

    <div id="historyModal" class="modal">
        <div class="quick-note">
            <div class="sticky-history-header">
                <h2 style="color:var(--neon-green); margin:0;">RIDE NOTES</h2>
                <div style="display:flex; gap:20px; align-items:center;">
                    <span id="exportPdf" class="material-icons-round" style="cursor:pointer; color:var(--danger-red); font-size:28px;">picture_as_pdf</span>
                    <span id="closeHistory" class="material-icons-round" style="cursor:pointer; font-size:28px;">close</span>
                </div>
            </div>
            <div class="chart-wrapper"><div class="chart-container" id="rideChart"></div></div>
            <div class="history-list-container" id="lapList"></div>
        </div>
    </div>

    <div id="locModal" class="standard-modal">
        <div class="modal-card">
            <h2>LOCATION</h2>
            <input type="text" id="locInput" placeholder="Enter Route" style="width:90%; padding:12px; margin-bottom:15px; border-radius:10px; border:none;">
            <button id="saveLoc" style="width:100%; padding:15px; background:var(--neon-green); border-radius:15px; font-weight:800; border:none;">SAVE</button>
        </div>
    </div>

    <div id="goalModal" class="standard-modal">
        <div class="modal-card">
            <h2>SET TARGET</h2>
            <input type="number" id="goalInput" placeholder="KM" style="width:90%; padding:12px; margin-bottom:10px; border-radius:10px; border:none;">
            <input type="date" id="dateInput" style="width:90%; padding:12px; margin-bottom:15px; border-radius:10px; border:none;">
            <button id="saveGoal" style="width:100%; padding:15px; background:var(--neon-green); border-radius:15px; font-weight:800; border:none;">SET GOAL</button>
        </div>
    </div>

<script>
    let totalDistance = parseFloat(localStorage.getItem('chan_accumulated_km')) || 0;
    let targetGoal = parseFloat(localStorage.getItem('chan_target_km')) || 0;
    let targetDate = localStorage.getItem('chan_target_date') || "";
    let rideLocation = localStorage.getItem('chan_ride_loc') || "NOT SET";
    
    let sessionDistance = parseFloat(localStorage.getItem('chan_session_dist')) || 0;
    let totalSeconds = parseInt(localStorage.getItem('chan_session_seconds')) || 0;
    let ridePath = JSON.parse(localStorage.getItem('chan_session_path')) || [];
    let lastSpokenMilestone = Math.floor(sessionDistance * 2) / 2;
    let lastCoords = null;
    let stationaryTime = 0;
    let isPausedManually = true;
    let speechVolume = 1;

    let watchID, timerInterval, db, wakeLock = null;
    let map, routeLine, currentMarker, streetTiles, satelliteTiles;
    let mapState = 2;

    function speak(t) { 
        window.speechSynthesis.cancel(); 
        const msg = new SpeechSynthesisUtterance(t);
        msg.volume = speechVolume;
        window.speechSynthesis.speak(msg); 
    }

    document.getElementById('volSlider').oninput = (e) => { speechVolume = e.target.value; };

    const dbReq = indexedDB.open("rideProEliteDB", 5);
    dbReq.onupgradeneeded = (e) => {
        let db = e.target.result;
        if(!db.objectStoreNames.contains("rides")) db.createObjectStore("rides", { keyPath: "id", autoIncrement: true });
    };
    dbReq.onsuccess = (e) => { db = e.target.result; startGlobalWatcher(); };

    window.onload = () => {
        initMap();
        updateDisplay();
        checkGoalStatus();
        document.getElementById('fullDate').innerText = new Date().toLocaleDateString('en-GB');
        document.getElementById('locDisplay').innerText = rideLocation;
        setInterval(() => { document.getElementById('liveClock').innerText = new Date().toTimeString().split(' ')[0]; }, 1000);
    };

    function initMap() {
        map = L.map('map', { zoomControl: false }).setView([0, 0], 15);
        streetTiles = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        satelliteTiles = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{y}/{x}/{z}');
        routeLine = L.polyline(ridePath, {color: '#32D74B', weight: 6}).addTo(map);
        currentMarker = L.circleMarker([0, 0], {radius: 8, color: '#0A84FF', fillColor: '#0A84FF', fillOpacity: 1}).addTo(map);
    }

    function startGlobalWatcher() {
        watchID = navigator.geolocation.watchPosition(pos => {
            const { latitude: lat, longitude: lng, accuracy, speed } = pos.coords;
            if(currentMarker) currentMarker.setLatLng([lat, lng]);
            updateGpsIcon(accuracy);
            const currentSpeedKmh = (speed || 0) * 3.6;

            if (!timerInterval && !isPausedManually && currentSpeedKmh > 5) {
                startRide();
                speak("Resuming ride.");
            }

            if (timerInterval && accuracy <= 40) {
                if (lastCoords) {
                    const R = 6371;
                    const dLat = (lat - lastCoords.lat) * Math.PI/180;
                    const dLon = (lng - lastCoords.lng) * Math.PI/180;
                    const a = Math.sin(dLat/2)**2 + Math.cos(lastCoords.lat * Math.PI/180) * Math.cos(lat * Math.PI/180) * Math.sin(dLon/2)**2;
                    const d = R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
                    if (d > 0.005) { 
                        stationaryTime = 0;
                        sessionDistance += d;
                        ridePath.push([lat, lng]);
                        routeLine.addLatLng([lat, lng]);
                        localStorage.setItem('chan_session_dist', sessionDistance);
                        localStorage.setItem('chan_session_path', JSON.stringify(ridePath));
                        updateDisplay();
                        checkVoiceMilestones();
                    }
                }
            }
            lastCoords = {lat, lng};
        }, null, {enableHighAccuracy: true});
    }

    function startRide() {
        isPausedManually = false;
        stationaryTime = 0;
        document.getElementById('startIcon').innerText = "pause";
        document.getElementById('stopBtn').classList.remove('hidden');
        document.getElementById('headerRideIcon').classList.add('riding-pulse');
        if (!timerInterval) {
            timerInterval = setInterval(() => {
                totalSeconds++;
                stationaryTime++;
                if (stationaryTime > 120) { pauseRide(); speak("Ride paused."); }
                localStorage.setItem('chan_session_seconds', totalSeconds);
                updateDisplay();
            }, 1000);
        }
    }

    function pauseRide() {
        clearInterval(timerInterval);
        timerInterval = null;
        document.getElementById('startIcon').innerText = "play_arrow";
        document.getElementById('headerRideIcon').classList.remove('riding-pulse');
    }

    document.getElementById('startBtn').onclick = () => {
        if (document.getElementById('startIcon').innerText === "pause") {
            isPausedManually = true; pauseRide(); speak("Ride paused.");
        } else { startRide(); speak("ride resumed."); }
    };

    document.getElementById('stopBtn').onclick = async () => {
        if(!confirm("Finish and Save?")) return;
        pauseRide();
        const finalDist = sessionDistance.toFixed(2);
        const tx = db.transaction("rides", "readwrite");
        tx.objectStore("rides").add({ 
            date: document.getElementById('fullDate').innerText, 
            distance: finalDist, duration: document.getElementById('timer').innerText, 
            pace: document.getElementById('pace').innerText, location: rideLocation, route: ridePath 
        });
        totalDistance += sessionDistance;
        localStorage.setItem('chan_accumulated_km', totalDistance);
        localStorage.removeItem('chan_session_dist');
        localStorage.removeItem('chan_session_seconds');
        localStorage.removeItem('chan_session_path');
        speak(`Run Completed And Saved. Your final distance is ${finalDist} kilometers. Well Done Chanthiran.`);
        setTimeout(() => location.reload(), 4000);
    };

    const lockOverlay = document.getElementById('pocketLock');
    const unlockBtn = document.getElementById('unlockBtn');
    let unlockTimer;
    document.getElementById('lockBtn').onclick = () => { lockOverlay.style.display = 'flex'; };
    const startUnlock = (e) => {
        e.preventDefault();
        unlockBtn.style.borderColor = "var(--neon-green)"; unlockBtn.style.color = "var(--neon-green)";
        unlockBtn.style.transform = "scale(0.9)";
        unlockTimer = setTimeout(() => { lockOverlay.style.display = 'none'; resetUnlockBtn(); }, 1500);
    };
    const cancelUnlock = () => { clearTimeout(unlockTimer); resetUnlockBtn(); };
    const resetUnlockBtn = () => { unlockBtn.style.borderColor = "#222"; unlockBtn.style.color = "#222"; unlockBtn.style.transform = "scale(1)"; };
    unlockBtn.addEventListener('touchstart', startUnlock);
    unlockBtn.addEventListener('touchend', cancelUnlock);
    unlockBtn.addEventListener('mousedown', startUnlock);
    unlockBtn.addEventListener('mouseup', cancelUnlock);

    function updateDisplay() {
        document.getElementById('distance').innerText = sessionDistance.toFixed(2);
        let cur = totalDistance + sessionDistance;
        document.getElementById('doneKm').innerText = cur.toFixed(2);
        if (targetGoal > 0) {
            document.getElementById('balKm').innerText = Math.max(targetGoal - cur, 0).toFixed(2);
            document.getElementById('progressBar').style.width = Math.min((cur / targetGoal) * 100, 100) + "%";
        }
        const mins = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
        const secs = (totalSeconds % 60).toString().padStart(2, '0');
        document.getElementById('timer').innerText = `${mins}:${secs}`;
        if (sessionDistance > 0.01) {
            let paceMin = (totalSeconds / 60) / sessionDistance;
            document.getElementById('pace').innerText = `${Math.floor(paceMin)}'${Math.floor((paceMin % 1) * 60).toString().padStart(2, '0')}"`;
        }
    }

    function checkVoiceMilestones() {
        let currentMilestone = Math.floor(sessionDistance * 2) / 2;
        if (currentMilestone > lastSpokenMilestone) {
            lastSpokenMilestone = currentMilestone;
            speak(`${currentMilestone} kilometers.`);
        }
    }

    function updateGpsIcon(accuracy) {
        const icon = document.getElementById('gpsIcon');
        const accDisplay = document.getElementById('accDisplay');
        if (accuracy < 25) { 
            icon.classList.add('sig-good'); accDisplay.innerText = `ACCURACY: ${accuracy.toFixed(0)}M (LOCKED)`; 
            accDisplay.style.color = "var(--accent-blue)"; 
        } else { 
            icon.classList.remove('sig-good'); accDisplay.innerText = `ACCURACY: ${accuracy.toFixed(0)}M (SEARCHING)`; 
            accDisplay.style.color = "var(--warning-yellow)"; 
        }
    }

    function checkGoalStatus() {
        if (!targetDate || targetGoal <= 0) return;
        const due = new Date(targetDate).setHours(0,0,0,0);
        const diffDays = Math.ceil((due - new Date().setHours(0,0,0,0)) / 86400000);
        document.getElementById('balDateDisplay').innerText = `DUE: ${targetDate.split('-').reverse().join('/')}`;
        document.getElementById('daysLeftDisplay').innerText = diffDays < 0 ? "OVERDUE" : `${diffDays} DAYS LEFT`;
    }

    document.getElementById('mapLoopBtn').onclick = function() {
        mapState = (mapState + 1) % 3;
        const mapEl = document.getElementById('map');
        if (mapState === 0) { mapEl.style.display = 'block'; map.removeLayer(satelliteTiles); streetTiles.addTo(map); }
        else if (mapState === 1) { mapEl.style.display = 'block'; map.removeLayer(streetTiles); satelliteTiles.addTo(map); }
        else { mapEl.style.display = 'none'; }
        if (mapState !== 2) setTimeout(() => map.invalidateSize(), 200);
    };

    document.getElementById('openHistory').onclick = () => { document.getElementById('historyModal').style.display = 'flex'; renderHistory(); };
    document.getElementById('closeHistory').onclick = () => document.getElementById('historyModal').style.display = 'none';
    document.getElementById('editGoal').onclick = () => document.getElementById('goalModal').style.display = 'flex';
    document.getElementById('saveGoal').onclick = () => {
        localStorage.setItem('chan_target_km', document.getElementById('goalInput').value);
        localStorage.setItem('chan_target_date', document.getElementById('dateInput').value);
        location.reload();
    };
    document.getElementById('editLoc').onclick = () => document.getElementById('locModal').style.display = 'flex';
    document.getElementById('saveLoc').onclick = () => {
        localStorage.setItem('chan_ride_loc', document.getElementById('locInput').value);
        location.reload();
    };
    document.getElementById('newRideBtn').onclick = () => { if(confirm("Wipe all data?")) { speak("Its a New Run. Run for Health"); localStorage.clear(); setTimeout(() => location.reload(), 2000); } };

    function renderHistory() {
        const tx = db.transaction("rides", "readonly");
        const req = tx.objectStore("rides").getAll();
        req.onsuccess = () => {
            const list = document.getElementById('lapList'), chart = document.getElementById('rideChart');
            list.innerHTML = ""; chart.innerHTML = "";
            const rides = req.result;
            const maxDist = Math.max(...rides.map(r => parseFloat(r.distance))) || 1;
            rides.forEach(ride => {
                const bar = document.createElement('div'); bar.className = 'chart-bar';
                bar.style.height = `${(parseFloat(ride.distance) / maxDist) * 100}%`;
                bar.innerHTML = `<span class="bar-val">${ride.distance}</span>`;
                chart.appendChild(bar);
            });
            rides.reverse().forEach(ride => {
                const row = document.createElement('div'); row.className = "history-item";
                row.innerHTML = `<div><strong>${ride.date}</strong><br>${ride.distance} KM</div>
                                 <span class="material-icons-round" onclick="deleteRide(${ride.id})" style="color:var(--danger-red);">delete</span>`;
                list.appendChild(row);
            });
        };
    }
    window.deleteRide = (id) => { if(confirm("Delete?")) db.transaction("rides", "readwrite").objectStore("rides").delete(id).onsuccess = renderHistory; };
</script>
</body>
</html>
